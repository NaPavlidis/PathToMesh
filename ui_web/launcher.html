<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Launcher no visual do app: o MESMO tema.css (cores, fontes, botões, cabeçalho) e os cartões
       e avisos do estilo.css; o launcher.css tem só o layout compacto dele. Funciona offline. -->
  <title>PathToMesh - Launcher</title>
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body class="launcher">
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <defs>
      <symbol id="i-atualizar" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-pacote" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></symbol>
      <symbol id="i-cubo" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></symbol>
      <symbol id="i-nota" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
      <symbol id="i-aviso" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="i-erro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
      <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="barra-topo">
      <div class="marca">
        <img id="logo-cabecalho" class="logo" alt="PathToMesh" hidden>
        <span id="nome-app" class="nome-app" hidden>PathToMesh</span>
        <span class="selo">LAUNCHER</span>
      </div>
      <!-- versão atual no canto do cabeçalho (economiza uma linha no cartão "Versão") -->
      <p id="txt-versao" class="mono-sm suave versao-topo"></p>
    </header>

    <main class="area launcher-corpo">
      <div class="lista-launcher">
        <article class="cartao cartao-launcher">
          <div class="texto-launcher">
            <h2 class="label-lg destaque com-icone"><svg class="ic"><use href="#i-atualizar"/></svg><span>Versão</span></h2>
            <p id="st-atualizacao" class="body-sm suave estado-launcher">Aguarde...</p>
          </div>
          <div class="linha-botoes">
            <button id="btn-atualizar" type="button" class="botao botao-principal" disabled>Atualizar agora</button>
            <button id="btn-procurar" type="button" class="botao botao-secundario">Procurar de novo</button>
          </div>
        </article>

        <article class="cartao cartao-launcher">
          <div class="texto-launcher">
            <h2 class="label-lg destaque com-icone"><svg class="ic"><use href="#i-pacote"/></svg><span>Dependências</span></h2>
            <p id="st-dependencias" class="body-sm suave estado-launcher">Aguarde...</p>
          </div>
          <div class="linha-botoes">
            <button id="btn-instalar" type="button" class="botao botao-secundario">Instalar de novo</button>
          </div>
        </article>

        <article class="cartao cartao-launcher">
          <div class="texto-launcher">
            <h2 class="label-lg destaque com-icone"><svg class="ic"><use href="#i-cubo"/></svg><span>Blender</span></h2>
            <p id="st-blender" class="body-sm suave estado-launcher">Aguarde...</p>
          </div>
          <div class="linha-botoes">
            <button id="btn-blender" type="button" class="botao botao-secundario">Conferir de novo</button>
          </div>
        </article>

        <article class="cartao cartao-launcher">
          <div class="texto-launcher">
            <h2 class="label-lg destaque com-icone"><svg class="ic"><use href="#i-nota"/></svg><span>Logs de erro</span></h2>
            <p id="st-logs" class="body-sm suave estado-launcher">Aguarde...</p>
          </div>
          <div class="linha-botoes">
            <button id="btn-pasta-logs" type="button" class="botao botao-secundario">Abrir pasta de logs</button>
            <button id="btn-enviar-logs" type="button" class="botao botao-secundario">Enviar agora</button>
          </div>
        </article>
      </div>

      <div class="acao-launcher">
        <button id="btn-abrir" type="button" class="botao botao-principal botao-grande botao-abrir">▶  Abrir o app</button>
      </div>

      <!-- Detalhes (log de atualização/pip): aparece só enquanto o launcher trabalha e some depois.
           Se a tarefa escreveu alguma mensagem (resultado ou erro), fica até clicar em "Ocultar". -->
      <section id="bloco-detalhes" class="detalhes-launcher" hidden>
        <div class="detalhes-cab">
          <p id="txt-trabalhando" class="label-md suave com-icone"><span class="girando" aria-hidden="true"></span><span id="txt-tarefa">Trabalhando...</span></p>
          <button id="btn-ocultar-detalhes" type="button" class="botao botao-secundario botao-mini">Ocultar</button>
        </div>
        <pre id="txt-mensagens" class="relatorio mono-sm mensagens-launcher" aria-live="polite" hidden></pre>
      </section>
    </main>
  </div>

  <!-- Confirmação (no lugar da caixa "Atualizar" do Tk) e erros -->
  <div id="janela-aviso" class="fundo-modal fundo-aviso" hidden>
    <div class="modal modal-aviso" role="alertdialog" aria-modal="true" aria-labelledby="aviso-titulo" aria-describedby="aviso-mensagem">
      <header class="aviso-cab">
        <svg id="aviso-icone" class="ic ic-titulo aviso"><use href="#i-aviso"/></svg>
        <h2 id="aviso-titulo" class="headline-md">Atenção</h2>
      </header>
      <p id="aviso-mensagem" class="body-md aviso-mensagem"></p>
      <footer class="modal-rodape">
        <button id="btn-aviso-nao" type="button" class="botao botao-secundario" hidden>Não</button>
        <button id="btn-aviso-ok" type="button" class="botao botao-principal">OK</button>
      </footer>
    </div>
  </div>

  <script src="launcher.js"></script>
</body>
</html>
